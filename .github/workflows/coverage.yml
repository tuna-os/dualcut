name: Coverage

# Nightly code-coverage measurement. Runs the full test suite under LLVM
# coverage instrumentation and uploads the result to Codecov, whose
# project/patch targets live in codecov.yml. Runs on a schedule so coverage
# is tracked even when no PR is open; workflow_dispatch covers manual runs.

on:
  schedule:
    # 06:00 UTC daily — the org's early morning, before most US contributors
    # start, so the run does not collide with daytime PRs.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage:
    name: Nightly coverage
    runs-on: ubuntu-latest
    container:
      image: quay.io/fedora/fedora:45
    steps:
      # checkout degrades to a tarball without git in the container.
      - name: Install git first
        run: dnf install -y -q git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain + runtime + coverage tooling
        run: |
          dnf install -y -q cargo rust clippy clang-devel pkgconf-pkg-config \
            llvm llvm-devel \
            gtk4-devel libadwaita-devel gstreamer1-devel \
            gstreamer1-plugins-base-devel gst-editing-services-devel \
            gstreamer1-plugins-good gstreamer1-plugins-bad-free \
            gstreamer1-plugins-base-tools gstreamer1-plugins-good-extras \
            gstreamer1-plugin-libav \
            mesa-vulkan-drivers python3-pillow xorg-x11-server-Xvfb xset xz
          git config --global --add safe.directory "$(pwd)"

      - name: Install cargo-llvm-cov (not packaged in Fedora)
        run: cargo install cargo-llvm-cov --root /usr/local

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: engine

      - name: Measure coverage
        working-directory: engine
        run: cargo llvm-cov test --all-features --lcov --output-path coverage.lcov

      - name: Upload coverage to Codecov
        if: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: engine/coverage.lcov
          token: ${{ secrets.CODECOV_TOKEN }}
