name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint, unit, and render smoke tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [fixed, prefix]
        shard: [1, 2, 3, 4, 5, 6, 7]
    container:
      image: quay.io/fedora/fedora:45
      options: --cap-add SYS_PTRACE
    steps:
      # checkout degrades to a tarball without git in the container.
      - name: Install git first
        run: dnf install -y -q git

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Schema/types in sync with the bundled agent skill (#49)
        # No diffutils in the bare container image yet (toolchain install
        # is the next step) -- compare via a shell builtin instead.
        run: |
          [ "$(cat engine/schema/dualcut.d.ts)" = "$(cat skills/dualcut/references/dualcut.d.ts)" ] || {
            echo "engine/schema/dualcut.d.ts and skills/dualcut/references/dualcut.d.ts have drifted"
            exit 1
          }
          [ "$(cat engine/schema/dualcut.schema.json)" = "$(cat skills/dualcut/references/dualcut.schema.json)" ] || {
            echo "engine/schema/dualcut.schema.json and skills/dualcut/references/dualcut.schema.json have drifted"
            exit 1
          }

      - name: Install toolchain + runtime
        run: |
          dnf install -y -q cargo rust clippy clang-devel pkgconf-pkg-config \
            gtk4-devel libadwaita-devel gstreamer1-devel \
            gstreamer1-plugins-base-devel gst-editing-services-devel \
            gstreamer1-plugins-good gstreamer1-plugins-bad-free \
            gstreamer1-plugins-base-tools gstreamer1-plugins-good-extras \
            gstreamer1-plugin-libav \
            mesa-vulkan-drivers gdb python3-pillow xorg-x11-server-Xvfb xset xz
          git config --global --add safe.directory "$(pwd)"

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: engine

      - name: Select variant
        if: matrix.variant == 'prefix'
        run: sed -i '/scripting::init_platform();/d' engine/src/lib.rs && git diff --stat

      - name: Build app binary
        working-directory: engine
        run: cargo build --features preview,scripting,vector

      - name: Cold-cache app walkthrough x6 with hang dump
        run: |
          echo "variant=${{ matrix.variant }}"
          Xvfb :95 -screen 0 1280x800x24 > /tmp/xvfb.log 2>&1 &
          sleep 3
          for i in 1 2 3 4 5 6; do
            rm -rf engine/examples/.dualcut-cache "$HOME/.cache/dualcut" /root/.cache/dualcut
            GDK_BACKEND=x11 WAYLAND_DISPLAY= DISPLAY=:95 \
              DBUS_SESSION_BUS_ADDRESS="unix:path=/nonexistent" \
              DUALCUT_API_PORT=0 DUALCUT_WALKTHROUGH=1 \
              engine/target/debug/preview engine/examples/demo-project.json > /tmp/app$i.log 2>&1 &
            pid=$!
            n=0
            while kill -0 $pid 2>/dev/null && [ $n -lt 75 ]; do sleep 1; n=$((n+1)); done
            if kill -0 $pid 2>/dev/null; then
              echo "HANG variant=${{ matrix.variant }} attempt=$i"
              grep WALKTHROUGH-SHOT /tmp/app$i.log
              gdb -q -batch -p $pid -ex 'thread apply all bt 25' 2>&1 | grep -E '^Thread |^#' | head -600
              kill -9 $pid
            else
              wait $pid || true
              echo "done variant=${{ matrix.variant }} attempt=$i after ${n}s shots=$(grep -c WALKTHROUGH-SHOT /tmp/app$i.log)"
            fi
          done
